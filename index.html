], "answer": "A"}, {"id": 139, "type": "单选题", "content": "公司首次用于航煤生产的原油，由（    ）负责提供书面材料，经军用油领导小组审定后交技术质量部上报民航局报备。", "options": ["技术质量部", "生产计划部", "运行部", "质检中心"], "answer": "B"}, {"id": 140, "type": "单选题", "content": "根据实际生产的需要提出油品小调试验要求，由（    ）制定油品小调试验方案。", "options": ["技术质量部", "生产计划部", "运行部", "质检中心"], "answer": "A"}, {"id": 141, "type": "多选题", "content": "以下属于汽油抗爆剂的是（    ）。", "options": ["MTBE", "甲醇", "非芳", "乙醇"], "answer": "A;B;D"}, {"id": 142, "type": "多选题", "content": "对实验室活动方法的偏离，应（    ）。", "options": ["事先将该偏离形成文件", "做技术判断", "获得授权", "被客户接受"], "answer": "A;B;C;D"}, {"id": 143, "type": "多选题", "content": "扩展不确定度的数值应满足（    ）的要求。", "options": ["不应超过两位有效数字", "符合GB/T 27418", "最终报告的测量结果的末位", "应与扩展不确定度的末位对应根据通用的规则进行数值修约"], "answer": "A;B;C;D"}, {"id": 144, "type": "多选题", "content": "石油产品水溶性酸碱测定意义有（    ）。", "options": ["判断油品的腐蚀性能", "判断油品的氧化、胶化及分解情况", "判断油品是否合格", "判断油品含何种酸碱，以将其除去。"], "answer": "A;B;C"}, {"id": 145, "type": "多选题", "content": "固体废物污染物包括（    ）。", "options": ["工业固体废物", "生物垃圾", "建筑垃圾、农业固体废物", "危险废物"], "answer": "A;B;C;D"}, {"id": 146, "type": "实操题", "content": "如何计算汽油加剂量，并提供给油品储运部。（5分）", "options": [], "answer": "汽油加剂：\n（1）在LIMS中点击“检验”模块。（1分）\n（2）选择“输入油品调合数据”。（1分）\n（3）选择待加剂的油罐，输入采样时间。（1分）\n（4）输入罐量，输入抗静电剂加剂比例。（1分）\n（5）保存计算得到的加剂量，并报给油品二调。（1分）"}, {"id": 147, "type": "实操题", "content": "如何计算柴油加剂量，并提供给油品储运部。（5分）", "options": [], "answer": "柴油加剂：\n（1）在LIMS中点击“检验”模块。（1分）\n（2）选择“输入油品调合数据”。（1分）\n（3）选择待加剂的油罐，输入采样时间。（1分）\n（4）输入罐量，输入抗静电剂、抗磨剂、十六烷值改进剂加剂比例。（1分）\n（5）保存计算得到的加剂量，并报给油品二调。（1分）"}, {"id": 148, "type": "实操题", "content": "如何计算航煤加剂量，并提供给油品储运部。（5分）", "options": [], "answer": "航煤加剂：\n（1）在LIMS中点击“检验”模块。（1分）\n（2）选择“输入油品调合数据”。（1分）\n（3）选择待加剂的油罐，输入采样时间。（1分）\n（4）输入罐量，输入抗静电剂、抗磨剂加剂比例。（1分）\n（5）保存计算得到的加剂量，并报给油品二调。（1分）"}, {"id": 149, "type": "实操题", "content": "如何计算变压器油加剂量，并提供给油品储运部。（5分）", "options": [], "answer": "变压器油加剂：\n（1）在LIMS中点击“检验”模块。（1分）\n（2）选择“输入油品调合数据”。（1分）\n（3）选择待加剂的油罐，输入采样时间。（1分）\n（4）输入罐量，输入抗氧剂、降凝剂加剂比例。（1分）\n（5）保存计算得到的加剂量，并报给油品二调。（1分）"}, {"id": 150, "type": "实操题", "content": "如何计算出口燃料油加剂量，并提供给油品储运部。（5分）", "options": [], "answer": "出口燃料油加剂：\n（1）在LIMS中点击“检验”模块。（1分）\n（2）选择“输入油品调合数据”。（1分）\n（3）选择待加剂的油罐，输入采样时间。（1分）\n（4）输入罐量，输入降凝剂加剂比例。（1分）\n（5）保存计算得到的加剂量，并报给油品二调。（1分）"}, {"id": 151, "type": "实操题", "content": "公司内部分析任务的处理。（5分）", "options": [], "answer": "当检查员电话接到公司内部分析任务的处理：\n（1）接受分析任务时确认样品来源，如分公司常规样品，按常规样品指定的分析方法在LIMS系统中下发到指定的室站。（1分）\n（2）如非常规样品和客户确认分析任务的分析项目，考虑化验室是否具有分析能力，分析时间安排。（1分）\n（3）如没有能力及时回复客户。（1分）\n（4）没有问题时在LIMS系统中下发到指定的室站。（1分）\n（5）分析完成发布。（1分）"}, {"id": 152, "type": "实操题", "content": "出现错误分析任务的纠错。（5分）", "options": [], "answer": "发现分析任务有疑问时及时处理：\n（1）如成品的分析任务方法有误联系任务下发单位确认是否有误。（1分）\n（2）如有错误通知任务下发分析修订。（1分）\n（3）部分临时样品客户不清楚和客户协商后确认分析方法，化验室没有分析能力或由于生产任务不能完成或不能及时完成及时通知客户。（3分）"}, {"id": 153, "type": "实操题", "content": "可疑分析数据的处理。（5分）", "options": [], "answer": "可疑分析数据的处理：\n（1）及时安排化验室进行样品复查。（1分）\n（2）及时联系调度生产是否调整或生产装置是否波动。（1分）\n（3）重要质量数据在通报同时安排不同室站进行比对，确保上报数据的正确性。（3分）"}, {"id": 154, "type": "实操题", "content": "开具合格证。（5分）", "options": [], "answer": "开具合格证：\n（1）在LIMS中点击“检验”模块。（1分）\n（2）选择“生成报表”，点击“产品合格证”。（1分）\n（3）选择待生成的油罐品种，在“合格待生成”状态下查阅数据。（1分）\n（4）确认合格证无误，点击保存。（1分）\n（5）打印合格证，并盖章。（1分）"}, {"id": 155, "type": "实操题", "content": "发放合格证（邮件）。（5分）", "options": [], "answer": "合格证发放：\n（1）打开高拍灯电源。（1分）\n（2）将打印并盖章的合格证放在高拍灯下方正中，点击“拍照”。（2分）\n（3）将拍照生成的PDF文件根据油罐号重命名。（1分）\n（4）将PDF通过石化邮传输给客户。（1分）"}, {"id": 156, "type": "实操题", "content": "发放合格证（石化通）。（5分）", "options": [], "answer": "合格证发放：\n（1）打开高拍灯电源。（1分）\n（2）将打印并盖章的合格证放在高拍灯下方正中，点击“拍照”。（2分）\n（3）将拍照生成的PDF文件根据油罐号重命名。（1分）\n（4）将PDF通过石化通传输给客户。（1分）"}, {"id": 157, "type": "实操题", "content": "发放合格证（正本）。（5分）", "options": [], "answer": "合格证发放：\n（1）根据客户的需要准备好打印并盖章的合格证。（1分）\n（2）将合格证传递给客户。（1分）\n（3）登记《合格证发放登记表》，填写罐批号、时间、车船号等，由客户签名确认。（3分）"}, {"id": 158, "type": "实操题", "content": "开具检测报告。（5分）", "options": [], "answer": "开具检测报告：\n（1）在LIMS中点击“检验”模块。（1分）\n（2）选择“任务管理”，单击选中待生成的样品。（1分）\n（3）点击“更多操作”，单击选中“生成检验报告单”。（1分）\n（4）确认报告单无误，点击保存。（1分）\n（5）打印检测报告单，并签名（获授权者）、盖章。（1分）"}, {"id": 159, "type": "实操题", "content": "发放检测报告（正本）。（5分）", "options": [], "answer": "检测报告发放：\n（1）根据客户的需要准备好打印并签名、盖章的检测报告。（2分）\n（2）将检测报告传递给客户。（1分）\n（3）登记《检测报告发放登记表》，填写罐批号、时间等，由客户签名确认。（2分）"}, {"id": 160, "type": "实操题", "content": "查询油品动态。（5分）", "options": [], "answer": "查询油品动态：\n（1）打开“石化窗”，进入公司门户网页。（1分）\n（2）点击“应用系统”，进入“股份iMES”平台。（1分）\n（3）点击“罐区管理”，点击“罐区收付管理”，点击“收付关系综合查询”。（2分）\n（4）选择待查询时间段，点击“检查”。（1分）"}, {"id": 161, "type": "实操题", "content": "查询实时动态。（5分）", "options": [], "answer": "查询实时动态：\n（1）打开“石化窗”，进入公司门户网页。（1分）\n（2）点击“应用系统”，进入“实时数据”平台。（1分）\n（3）点击待查询部门，如“储运部”，点击“成品工区”，点击“118罐”。（2分）\n（4）选择待查询时间段，点击“确定”。（1分）"}, {"id": 162, "type": "实操题", "content": "样品标签打印。（5分）", "options": [], "answer": "样品标签打印：\n（1）在LIMS中点击“检验”模块。（1分）\n（2）选择“任务管理”，单击选中待生成的样品，。（1分）\n（3）点击“更多操作”，单击选中“生成样品标签”。（1分）\n（4）标签模板选择“检查室封样标签”。（1分）\n（5）点击打印，打印机选择“斑马打印机”。（1分）"}, {"id": 163, "type": "判断题", "content": "规范包装好的固体废物，要及时委外处置，不能及时委外处置的要及时运输到固体废物贮存库内。在运离作业部（装置）区域前，必须确保收集区域防雨、防晒、防渗、场地整洁、无异味。", "options": ["对", "错"], "answer": "A"}, {"id": 164, "type": "多选题", "content": "目前各分析站（研究室）的废试剂瓶、油回丝等废固均采取委外方式处置，不可以再作为工业垃圾处理，以下关于配送至危废仓库的废固要求中，正确的是（    ）。", "options": ["请确保“废桶无残液，桶表面清洁，密封", "吨袋内加套内衬袋，确保不渗漏", "吨袋表面清洁，密封", "贴好危废标签（写好危废名称）"], "answer": "A;B;C"}, {"id": 165, "type": "判断题", "content": "各危险废物产生单位应结合本单位工艺技术特点制定相关应急预案，定期组织演练（不低于2次/年）并保存好演练记录。", "options": ["对", "错"], "answer": "A"}, {"id": 166, "type": "判断题", "content": "固废现场贮存应落实“防风、防雨、防雷击、防渗漏”措施。", "options": ["对", "错"], "answer": "B"}, {"id": 167, "type": "多选题", "content": "化验室不能直接排入下水道的废液是（    ）。", "options": ["无机酸类废液", "强碱类废液", "含汞、铬、镉、砷、氰化物等超过最高容许排放浓度的剧毒物废液", "易燃的有机溶剂的废液"], "answer": "A;B;C;D"}, {"id": 168, "type": "判断题", "content": "企业应坚持“源头削减、过程控制、末端治理”的污染防治理念、全面推行清洁生产，积极开展“三废”综合利用，最大限度地做到污染物减量化、资源化、无害化。", "options": ["对", "错"], "answer": "A"}, {"id": 169, "type": "多选题", "content": "硫化氢易溶于下列（    ）液体。", "options": ["水", "醇类", "汽油、煤油", "原油"], "answer": "A;B;C"}, {"id": 170, "type": "单选题", "content": "（    ）可以中和硫化氢气体。", "options": ["稀碱液", "消防水", "有机溶剂", "盐酸"], "answer": "A"}, {"id": 171, "type": "判断题", "content": "高浓度的硫化 油、车用柴油罐半成品罐清洗周期为8年。", "options": ["对", "错"], "answer": "A"}, {"id": 704, "type": "判断题", "content": "苯类产品、溶剂油罐成品罐清洗周期为4年。", "options": ["对", "错"], "answer": "A"}, {"id": 705, "type": "判断题", "content": "苯类产品、溶剂油罐半成品罐清洗周期为8年。", "options": ["对", "错"], "answer": "B"}, {"id": 706, "type": "单选题", "content": "为确保出厂产品质量，产品储罐必须定期清洗，一般车用汽油成品罐清洗周期（    ）年。", "options": ["1", "2", "4", "5"], "answer": "C"}, {"id": 707, "type": "单选题", "content": "为确保出厂产品质量，产品储罐必须定期清洗，一般喷气燃料成品罐清洗周期为（    ）年。", "options": ["1", "2", "4", "5"], "answer": "B"}, {"id": 708, "type": "单选题", "content": "为确保出厂产品质量，产品储罐必须定期清洗，一般车用柴油成品罐清洗周期为（    ）年。", "options": ["1", "2", "4", "5"], "answer": "C"}, {"id": 709, "type": "单选题", "content": "为确保出厂产品质量，产品储罐必须定期清洗，一般苯类产品成品罐清洗周期为（    ）年。", "options": ["1", "2", "4", "5"], "answer": "C"}, {"id": 710, "type": "单选题", "content": "根据销售中心当日出厂铁路计划，接收铁运工区电传车号，在接到洗槽站洗槽结束通知后，（    ）分钟之内到达洗槽站验车。", "options": ["10", "15", "30", "45"], "answer": "C"}, {"id": 711, "type": "单选题", "content": "仲裁分析是不同单位对同一试样分析结果发生争议时，要求权威机构用（    ）方法进行准确分析，以裁判原分析结果的准确性。", "options": ["国标方法", "公认的标准方法", "新方法", "经典的分析方法"], "answer": "B"}, {"id": 712, "type": "单选题", "content": "产品质量检验的实质是（    ）。", "options": ["事前预防", "事后把关", "全面控制", "应用统计技术"], "answer": "B"}, {"id": 713, "type": "单选题", "content": "（    ）不包含在NB/SH/T0164-2019容器重复使用及清洗规则之中，应采用专门容器储运。", "options": ["苯类产品", "航煤", "石脑油", "食用油脂抽提用溶剂油"], "answer": "D"}, {"id": 714, "type": "单选题", "content": "在（    ）情况下不能对不合格品采取让步或放行。", "options": ["有关的授权人员批准", "法律不允许", "顾客批准", "企业批准"], "answer": "B"}, {"id": 715, "type": "多选题", "content": "在船舱检验过程中，应首先查验油船前三载的（    ）等能证明洗舱的依据。", "options": ["装运品种", "洗舱记录", "洗舱发票", "排污发票"], "answer": "A;B;C;D"}, {"id": 716, "type": "多选题", "content": "在船舱检验过程中，应查验前载所装产品的（    ）等，没有明确合规证据的可不判定。", "options": ["检测报告", "品质证书", "质量合格证", "品种标号"], "answer": "A;B;C"}, {"id": 717, "type": "多选题", "content": "适合喷气燃料调和组分的有（    ）。", "options": ["常压一线", "烷基苯返回油", "加氢裂化煤油", "200号"], "answer": "B;C"}, {"id": 718, "type": "多选题", "content": "仲裁分析的特点有（    ）。", "options": ["由权威机构执行", "采用公认的标准方法进行分析", "要求有较高的准确度", "要求速度快，准确程度达到一定要求便可"], "answer": "A;B;C"}, {"id": 719, "type": "多选题", "content": "控制油品中硫含量的目的是（    ）。", "options": ["减少油品储存及使用中的腐蚀", "提高油品储存的稳定性，延长储存时间", "消除静电", "消泡"], "answer": "A;B"}, {"id": 720, "type": "多选题", "content": "对检验不合格的油船，（    ）。", "options": ["严禁接收船方有关油船质量的保证书", "不得开具容器合格证，不予装油", "向船方签发出厂产品质量合格证", "向码头工区发放容器合格证"], "answer": "A;B"}, {"id": 721, "type": "实操题", "content": "船舱容器检验（特洗）（5分）", "options": [], "answer": "船舱容器检验（特洗）：\n（1）查验油船前三载的装运品种、洗舱记录、洗舱发票、排污发票等能证明洗舱的依据。（1分）\n（2）查验前载所装产品的检测报告、品质证书、质量合格证等，没有明确合规证据的可不判定。（1分）\n（3）进入船舱按NB/SH/T 0164-2019中附录A要求进行检查。（1分）\n（4）若满足“四无一拭”要求，应向码头工区发放容器合格证正本。（1分）\n（5）同时向船方签发出厂产品质量合格证正本，并填写出厂合格证发放台账。（1分）"}, {"id": 722, "type": "实操题", "content": "船舱容器检验（普洗）（5分）", "options": [], "answer": "船舱容器检验（普洗）：\n（1）查验油船前三载的装运品种、洗舱记录、洗舱发票、排污发票等能证明洗舱的依据。（1分）\n（2）查验前载所装产品的检测报告、品质证书、质量合格证等，没有明确合规证据的可不判定。（1分）\n（3）不进入船舱，在观察孔检查船舱清洁情况。（1分）\n（4）若满足要求，应向码头工区发放容器合格证正本。（1分）\n（5）同时向船方签发出厂产品质量合格证正本，并填写出厂合格证发放台账。（1分）"}, {"id": 723, "type": "实操题", "content": "槽车容器检验（特洗）（5分）", "options": [], "answer": "槽车容器检验（特洗）\n（1）查验槽车的来历、上载油品品种记录。（1分）\n（2）查验特洗时间、温度是否达到要求。（1分）\n（3）进入槽车按NB/SH/T 0164-2019中附录A要求进行检查。（1分）\n（4）若满足“四无一拭”要求，应向铁运工区发放容器合格证正本。（1分）\n（5）对检验合格的航煤槽车，将容器合格证电传至铁运工区，在接收铁运工区返回的装车确认单后，核对车号、油种并签字确认，将该确认单再次电传至铁运工区。（1分）"}, {"id": 724, "type": "实操题", "content": "槽车容器检验（普洗）（5分）", "options": [], "answer": "槽车容器检验（普洗）\n（1）查验槽车的来历、上载油品品种记录。（1分）\n（2）不进入槽车，在人孔观察槽车清洁情况。（1分）\n（3）若满足要求，应向铁运工区发放容器合格证正本。（1分）\n（4）对检验合格的航煤槽车，将容器合格证电传至铁运工区，在接收铁运工区返回的装车确认单后，核对车号、油种并签字确认，将该确认单再次电传至铁运工区。（2分）"}, {"id": 725, "type": "实操题", "content": "油罐容器检验（5分）", "options": [], "answer": "油罐容器检验\n（1）查验油罐原装油品种，并根据拟装油品种进行质量检验。（1分）\n（2）如油罐拟装油品种不变，应对油罐清洁状况进行检查确认。（1分）\n（3）如油罐拟装油品种改变，应确认是否按要求进行清扫和处理，并对油罐清洁状况进行检查确认。（2分）\n（4）对检验合格的油罐，向储运部现场开具容器合格证。（1分）"}, {"id": 726, "type": "实操题", "content": "管线容器检验（5分）", "options": [], "answer": "油罐容器检验\n（1）查验管线原装油品种，并根据拟装油品种进行质量检验。（1分）\n（2）如管线拟装油品种不变，应对管线清洁状况进行检查确认。（1分）\n（3）如管线拟装油品种改变，应确认是否按要求进行清扫和处理，并对管线清洁状况进行检查确认。（2分）\n（4）对检验合格的管线，向储运部现场开具容器合格证。（1分）"}, {"id": 727, "type": "实操题", "content": "产品进出厂流程跟踪系统水路出厂（5分）", "options": [], "answer": "水路出厂：\n（1）登录“产品进出厂流程跟踪系统”。（1分）\n（2）输入用户名、口令，点击“确定”。（1分）\n（3）点击“水路出厂”按钮，单击选中待确认油船。（2分）\n（4）验舱合格后，点击“验舱（质检中心）”。（1分）"}, {"id": 728, "type": "实操题", "content": "产品进出厂流程跟踪系统水路卸油（5分）", "options": [], "answer": "水路卸油：\n（1）登录“产品进出厂流程跟踪系统”。（1分）\n（2）输入用户名、口令，点击“确定”。（1分）\n（3）点击“水路卸油”按钮，单击选中待确认油船。（1分）\n（4）取样后，点击“取样（质检中心）”。（1分）\n（5）分析合格后，点击“分析（质检中心）”。（1分）"}, {"id": 729, "type": "实操题", "content": "智能物流系统铁路槽车检验合格判定（5分）", "options": [], "answer": "智能物流系统铁路槽车合格判定：\n（1）登录“智能物流系统”。（1分）\n（2）点击洗车板块>>质检确认。（1分）\n（3）勾选所验槽车车号>>选择待装油品品种。（1分）\n（4）点击前载品种录入>>选择前载油品品种。（1分）\n（5）点击“合格”或“不合格”并进行“不合格原因维护”。（1分）"}, {"id": 730, "type": "实操题", "content": "智能物流系统铁路槽车检验\n检验查询（5分）", "options": [], "answer": "智能物流系统铁路槽车检验查询：\n（1）登录“智能物流系统”。（1分）\n（2）点击洗车板块>>合格检验查询。（1分）\n（3）点击通用查询>>合格检验历史查询。（1分）\n（4）预览质量检验中心槽车检查记录>>槽车检查合格证。（2分）"}, {"id": 731, "type": "实操题", "content": "LIMS中出厂装车数据录入（5分）", "options": [], "answer": "出厂装车数据录入：\n（1）在LIMS中点击“检验”模块。（1分）\n（2）选择“输入出厂装车数据”。（1分）\n（3）选择待检验的容器，输入车船号、原装油、现装油、检查员等信息。（1分）\n（4）勾选“容器清洁情况”下拉菜单中相应内容。（1分）\n（5）勾选“合格”或“不合格”，如“合格”则应输入“付出罐号及批号”、发往单位。（1分）"}, {"id": 732, "type": "实操题", "content": "LIMS中出厂装车数据查询（5分）", "options": [], "answer": "出厂装车数据查询：\n（1）在LIMS中点击“查询”模块。（1分）\n（2）选择“出厂装车数据”。（1分）\n（3）选择待查询的容器，选择相应时间。（1分）\n（4）选择“全部样品”进行查询。（1分）\n（5）或点击“查找”并输入“车号”或“船名”进行查询。（1分）"}, {"id": 733, "type": "多选题", "content": "二甲苯装置的节能措施有（    ）。", "options": ["装置采用热联合，提高二甲苯塔的操作压力，为其它分馏塔提供热源，而不用塔底重沸炉或蒸汽再沸器，提高热效率", "各塔底重沸器采用高效能换热器提高换热效率", "优化精馏塔和吸附塔操作", "提高加热炉热效率"], "answer": "A;B;C;D"}, {"id": 734, "type": "判断题", "content": "二甲苯燃烧的产物只有二氧化碳。", "options": ["对", "错"], "answer": "B"}, {"id": 735, "type": "单选题", "content": "在邻二甲苯、间二甲苯、对二甲苯、乙苯四种有机化合物中，熔点最高的是（    ）。", "options": ["邻二甲苯", "间二甲苯", "对二甲苯", "乙苯"], "answer": "C"}, {"id": 736, "type": "多选题", "content": "以下关于二甲苯来源和用途的说法正确的是（    ）。", "options": ["可从煤碳中获取二甲苯", "是生产聚酯纤维的重要原料", "在油漆和涂料工业中用作溶剂", "用于制造农药和香料"], "answer": "B;C;D"}, {"id": 737, "type": "多选题", "content": "工业上对二甲苯的分离和提纯方法有（    ）。", "options": ["精馏", "结晶", "吸附", "抽提"], "answer": "A;B;C"}, {"id": 738, "type": "多选题", "content": "二甲苯的异构体包括（    ）。", "options": ["邻二甲苯", "间二甲苯", "对二甲苯", "混合二甲苯"], "answer": "A;B;C"}, {"id": 739, "type": "多选题", "content": "以下职业病危害因素中，属于物理危害因素的有（    ）。", "options": ["高温", "辐射", "噪声", "氨"], "answer": "A;B;C"}, {"id": 740, "type": "多选题", "content": "用人单位不得故意破坏事故现场、毁灭有关证据，不得（    ）职业病危害事故。", "options": ["迟报", "漏报", "谎报", "瞒报"], "answer": "A;B;C;D"}, {"id": 741, "type": "判断题", "content": "在职业性健康检查中体检单位认为对部分劳动者需要复查和医学观察的劳动者，用人单位可以不理会。", "options": ["对", "错"], "answer": "B"}, {"id": 742, "type": "单选题", "content": "以下关于苯的化学性质，错误的是（    ）。", "options": ["能与氢气发生加成反应", "能使酸性高锰酸钾溶液褪色", "能发生取代反应", "在一定条件下能与氯气反应"], "answer": "B"}, {"id": 743, "type": "单选题", "content": "苯燃烧的现象是（    ）。", "options": ["产生淡蓝色火焰，生成二氧化碳和水", "产生明亮的火焰并伴有浓烟", ".产生黄色火焰，有刺激性气味气体生成", "燃烧缓慢，火焰呈红色"], "answer": "B"}, {"id": 744, "type": "判断题", "content": "苯与氢气的加成反应需要在高温高压和催化剂的条件下进行。", "options": ["对", "错"], "answer": "A"}, {"id": 745, "type": "判断题", "content": "因为苯难溶于水，所以它与水混合时不会发生任何相互作用。", "options": ["对", "错"], "answer": "B"}, {"id": 746, "type": "多选题", "content": "以下（    ）是苯在工业中的用途。", "options": ["作为有机溶剂", "用于合成塑料", "用于生产医药", "是合成橡胶的原料之一"], "answer": "A;B;C;D"}, {"id": 747, "type": "多选题", "content": "苯的同系物具有以下特点（    ）。", "options": ["分子中含有一个苯环", "苯环侧链为烷基", "符合通式 CₙH₂ₙ₋₆（n≥7）", "化学性质与苯完全相同"], "answer": "A;B;C"}, {"id": 748, "type": "单选题", "content": "当在有苯泄漏的环境中工作时，工作人员除了呼吸防护外，还需要注意（    ）。", "options": ["眼部防护，佩戴护目镜", "手部防护，佩戴橡胶手套", "脚部防护，穿防护靴", "以上都是"], "answer": "D"}, {"id": 749, "type": "单选题", "content": "对于长期接触苯的工作人员，定期进行（    ）检查是最重要的。", "options": ["视力检查", "血常规检查", "听力检查", "肝功能检查"], "answer": "B"}, {"id": 750, "type": "判断题", "content": "为了防止苯中毒，在可能接触苯的工作环境中可以用湿毛巾捂住口鼻来代替防毒面具。", "options": ["对", "错"], "answer": "B"}, {"id": 751, "type": "判断题", "content": "苯取样的时候必须佩戴对应的防护用品及苯检测仪。", "options": ["对", "错"], "answer": "A"}, {"id": 752, "type": "多选题", "content": "防止苯进入人体内的方法是（    ）。", "options": ["采样采用手套", "采样时戴好护目镜", "随身携带报警仪", "正确佩戴半面罩"], "answer": "B;C;D"}, {"id": 753, "type": "多选题", "content": "一个完整的事故应急体系有（    ）构成。", "options": ["组织体制", "运作机制", "法律基础", "应急保障系统"], "answer": "A;B;C;D"}, {"id": 754, "type": "判断题", "content": "公司新建、改建、扩建项目，必须严格执行建设项目“三同时”工作制度，工程须符合国家消防技术标准与规范，并按相关法规要求开展建设工程消防设计审核、消防验收、备案等手续。未经消防验收的项目禁止投入使用。", "options": ["对", "错"], "answer": "A"}, {"id": 755, "type": "判断题", "content": "应急（消防）管理工作贯彻“预防为主，防消结合”的方针，全面落实各级消防安全责任制，积极预防火灾事故发生。", "options": ["对", "错"], "answer": "A"}, {"id": 756, "type": "判断题", "content": "各单位、各部门应组织开展防火安全检查，及时消除火灾隐患。对不能立即整改的隐患应采取有效防护措施。", "options": ["对", "错"], "answer": "A"}, {"id": 757, "type": "单选题", "content": "根据国家消防法规要求，应急救援中心（    ）组织一次公司消防设施检测工作、消防安全评估工作，公司检测报告、评估报告送市消防监管部门审核、备案。", "options": ["3个月", "6个月", "9个月", "一年"], "answer": "D"}, {"id": 758, "type": "判断题", "content": "化学灼伤的致伤原理是化学物质与皮肤或黏膜接触，产生化学反应并具有渗透性，对细胞组织产生吸水，溶解组织蛋白和皂化脂肪组织的作用，从而破坏细胞组织的生理机能。", "options": ["对", "错"], "answer": "A"}, {"id": 759, "type": "单选题", "content": "馏程分析过程中如果出现烧瓶破裂，应先（    ），如已经出现着火用防火棉覆盖，火势较大应及时用灭火器。", "options": ["逃离现场", "大声呼喊", "切断电源", "拨打报警电话"], "answer": "C"}, {"id": 760, "type": "多选题", "content": "馏程分析过程中如果出现烧瓶破裂，可能出现的安全事故有（    ）。", "options": ["火灾", "烧烫伤", "玻璃碎片划伤", "硫化氢中毒"], "answer": "A;B;C"}, {"id": 761, "type": "多选题", "content": "化验分析中，不可以用手直接量取（    ）等试剂。", "options": ["甲醇", "乙醇", "丙酮", "醋酸"], "answer": "A;B;C;D"}, {"id": 762, "type": "判断题", "content": "分析作业过程中接触化学试剂、物料等有害物质或可能对眼睛造成伤害的作业过程和场所，可以不佩戴防护眼镜或面罩。", "options": ["对", "错"], "answer": "B"}, {"id": 763, "type": "判断题", "content": "使用高压气瓶时，操作人员不能正对气瓶出口处站立。操作时严禁敲打撞击，并经常检查有无漏气，注意压力表读数。", "options": ["对", "错"], "answer": "A"}, {"id": 764, "type": "判断题", "content": "特殊采样是指有固定采样点，但没有采样设施、高空作业或因生产需要而临时进行的采样作业。", "options": ["对", "错"], "answer": "B"}, {"id": 765, "type": "判断题", "content": "检查室特殊采样主要包括油船、铁路槽车、公路槽车、管线等。", "options": ["对", "错"], "answer": "A"}, {"id": 766, "type": "判断题", "content": "外籍船舶采样或验 ）其余车船样取除底部外的点样（按取样规则）。（2分）\n（3）管线样准备好器具，配合储运部采样。（1分）\n（4）公路槽车样准备好器具，监督采样。（1分）"}, {"id": 782, "type": "实操题", "content": "取样器具（5分）", "options": [], "answer": "取样器具：\n（1）选用已有标识的取样桶（带盖），防止误拿。（1分）\n（2）取样桶内准备好相应的取样器。（1分）\n（3）选用洁净的5L塑料采样桶，并贴好标签。（1分）\n（4）选用洁净的1L或500mL玻璃采样瓶，并贴好标签。（2分）"}, {"id": 783, "type": "实操题", "content": "常规取样操作（5分）", "options": [], "answer": "常规取样操作：\n（1）解开取样器采样绳，塞好塞子，并将取样器缓缓放入待取油品中。（1分）\n（2）到达相应高度时，悬停，并抖动取样器，打开塞子，取得样品。（2分）\n（3）收回采样绳，将油品缓缓倒入采样桶或采样瓶中。（1分）\n（4）结束后塞好塞子，绑好采样绳，放回取样桶（带盖中）。（1分）"}, {"id": 784, "type": "实操题", "content": "底部样取样操作（5分）", "options": [], "answer": "底部样取样操作：\n（1）解开取样器采样绳，并将取样器缓缓放入待取油品中。（1分）\n（2）到达容器底部时，等候1min左右，取得样品。（1分）\n（3）收回采样绳，提起拉杆弹簧，将油品由取样器底部流入采样桶或采样瓶中。（2分）\n（4）结束后绑好采样绳，放回取样桶（带盖中）。（1分）"}, {"id": 785, "type": "单选题", "content": "若对试剂进行鉴别时，正确的方式是（    ）。", "options": ["以手感知", "以鼻直接接近瓶口加以鉴别", "少量入口进行鉴别", "将试剂远离鼻子，以手轻轻煽动，稍闻即止"], "answer": "D"}, {"id": 786, "type": "单选题", "content": "进行有关化学液体的取样操作时，操作时应使用（    ）。", "options": ["皮手套", "棉手套", "一次性手套", "耐酸碱手套"], "answer": "D"}, {"id": 787, "type": "单选题", "content": "进行有关化学液体的操作时，应使用（    ）保护面部。", "options": ["太阳镜", "防护面罩", "毛巾", "纱布"], "answer": "B"}, {"id": 788, "type": "多选题", "content": "使用高速离心机下列说法正确的是（    ）。", "options": ["离心机的内盖盖上", "离心机高速运转有隆隆的响声", "离心管对称放置", "离心管盖盖上"], "answer": "A;C;D"}, {"id": 789, "type": "多选题", "content": "进入分析室后，要严格遵守安全规则，严禁（    ）。", "options": ["进食", "饮水", "吸烟", "穿拖鞋"], "answer": "A;B;C;D"}, {"id": 790, "type": "多选题", "content": "违章用电常常可能造成（    ）等严重事故。", "options": ["人身伤亡", "火灾", "损坏仪器设备"], "answer": "A;B;C"}, {"id": 791, "type": "判断题", "content": "生产经营单位应建立安全生产教育和培训档案。", "options": ["对", "错"], "answer": "A"}, {"id": 792, "type": "多选题", "content": "事故调查处理应遵循（    ）的原则。", "options": ["科学严谨", "依法依规", "实事求是", "注重实效"], "answer": "A;B;C;D"}, {"id": 793, "type": "多选题", "content": "新建扩建工程必须与主体工程同时（    ）。", "options": ["设计", "施工", "生产", "使用"], "answer": "A;B;C;D"}, {"id": 794, "type": "单选题", "content": "《中华人民共和国安全生产法》诞生于（    ）年。", "options": ["2002", "2004", "2006", "200 tent": "样品管理台账入库（5分）", "options": [], "answer": "样品管理台账入库：\n（1）在LIMS中点击“检验”模块，选择“样品管理>>成品分析”。（1分）\n（2）单击选中待入库样品，点击“输入检后留样信息”，输入并确认留样期限、留样数量、剩余数量。（2分）\n（3）在LIMS中点击“查询”模块；选择“留样信息”，选择“检完留样”。（1分）\n（4）点击“申请留样”，审核并确认留样信息。（1分）"}, {"id": 953, "type": "实操题", "content": "样品管理台账出库。（5分）", "options": [], "answer": "样品管理台账出库：\n（1）在LIMS中点击“查询”模块；选择“留样信息”，选择“检完留样”。（2分）\n（2）点击“到期提醒”，审核并确认留样信息。（1分）\n（3）单击选中待出库样品，右击后点击“处理留样”。（1分）\n（4）在“已处理”中可以查看并确认该样品是否确已处理。（1分）"}];
        const container = document.getElementById('quiz-container');
        const toc = document.getElementById('toc');
        // 从本地存储读取错题本
        let errorLog = JSON.parse(localStorage.getItem('inspector_errors') || '[]');

        function renderTOC() {
            toc.innerHTML = '';
            questions.forEach(q => {
                let div = document.createElement('div');
                div.className = 'toc-item';
                div.innerText = q.id;
                if (errorLog.includes(q.id)) div.classList.add('error');
                div.onclick = () => {
                    const target = document.getElementById('q-' + q.id);
                    // 减去顶部吸顶目录的高度
                    window.scrollTo({ top: target.offsetTop - 220, behavior: 'smooth' });
                };
                toc.appendChild(div);
            });
        }

        function renderQuestions() {
            questions.forEach(q => {
                let card = document.createElement('div');
                card.className = 'question-card';
                card.id = 'q-' + q.id;
                
                let title = document.createElement('div');
                title.innerHTML = `<strong>${q.id}. [${q.type}]</strong> ${q.content}`;
                title.style.marginBottom = '15px';
                card.appendChild(title);
                
                let optionsDiv = document.createElement('div');
                const labels = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];
                q.options.forEach((opt, idx) => {
                    let btn = document.createElement('div');
                    btn.className = 'option';
                    let label = labels[idx];
                    btn.innerText = label + ". " + opt;
                    btn.onclick = () => checkAnswer(q.id, label, btn, q.answer, optionsDiv, card);
                    optionsDiv.appendChild(btn);
                });
                card.appendChild(optionsDiv);
                
                let resultDiv = document.createElement('div');
                resultDiv.id = 'res-' + q.id;
                resultDiv.className = 'result-msg';
                card.appendChild(resultDiv);
                
                container.appendChild(card);
            });
        }

        function checkAnswer(qId, selected, btn, correctAns, optionsDiv, card) {
            let resDiv = document.getElementById('res-' + qId);
            // 锁定所有选项
            Array.from(optionsDiv.children).forEach(child => child.style.pointerEvents = 'none');
            
            if (selected === correctAns) {
                btn.classList.add('correct');
                resDiv.innerHTML = '<span style="color:#28a745;">✓ 回答正确</span>';
                // 答对了从错题本移除
                errorLog = errorLog.filter(id => id !== qId);
            } else {
                btn.classList.add('wrong');
                resDiv.innerHTML = `<span style="color:#dc3545;">✗ 回答错误。正确答案是：${correctAns}</span>`;
                if (!errorLog.includes(qId)) errorLog.push(qId);
            }
            localStorage.setItem('inspector_errors', JSON.stringify(errorLog));
            renderTOC();
        }

        renderTOC();
        renderQuestions();
    </script>
